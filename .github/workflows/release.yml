name: Release - Generate NuGet Package

on:
  release:
    types: [ published ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  validate-release:
    name: Validate Release Configuration
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      name: Checkout code
      
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: '6.x'
        
    - name: Restore NuGet Packages
      run: nuget restore Primo.MIA.sln
      
    - name: Validate Release Files
      run: |
        $errors = @()
        
        if (-not (Test-Path "Primo.MIA.csproj")) {
          $errors += "❌ Primo.MIA.csproj NOT found"
        } else {
          Write-Host "✅ Primo.MIA.csproj found"
          $csproj = Get-Content "Primo.MIA.csproj" -Raw
          if ($csproj -match '<GeneratePackageOnBuild>true</GeneratePackageOnBuild>') {
            Write-Host "✅ GeneratePackageOnBuild is enabled"
          } else {
            Write-Host "⚠️ GeneratePackageOnBuild may not be enabled"
          }
        }
        
        if (-not (Test-Path "README.md")) {
          $errors += "❌ README.md NOT found"
        } else {
          Write-Host "✅ README.md found"
        }

        # Для релиза по тегу: версия тега обязана присутствовать в CHANGELOG.md
        # (ASCII-only проверка, устойчива к кодировке файла)
        if ($env:GITHUB_REF -like 'refs/tags/v*') {
          $tagVersion = $env:GITHUB_REF -replace 'refs/tags/v', ''
          $changelog = Get-Content "CHANGELOG.md" -Raw -ErrorAction SilentlyContinue
          if (-not $changelog) {
            $errors += "FAIL: CHANGELOG.md NOT found"
          } elseif ($changelog -notmatch [regex]::Escape($tagVersion)) {
            $errors += "FAIL: CHANGELOG.md has no entry for version $tagVersion - describe changes before release"
          } else {
            Write-Host "OK: CHANGELOG.md contains version $tagVersion"
          }
        }

        if ($errors.Count -gt 0) {
          foreach ($err in $errors) { Write-Host $err }
          exit 1
        }
        
        Write-Host ""
        Write-Host "================================================"
        Write-Host " ✅ Валидация пройдена успешно!"
        Write-Host "================================================"

  publish-nuget:
    name: Build & Publish NuGet Package
    runs-on: windows-latest
    needs: validate-release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        TAG="${GITHUB_REF#refs/tags/v}"
        echo "version=$TAG" >> $GITHUB_OUTPUT
        echo "Detected version from tag: $TAG"

    # Пакет собирается из csproj (SDK-style): метаданные берутся из свойств
    # проекта, версия подменяется свойством Version из тега.
    # Ручной Primo.MIA.nuspec удалён как устаревший (несоответствие TFM и зависимостей).
    - name: Checkout LTools SDK (private bundle)
      uses: actions/checkout@v4
      with:
        repository: chelslava/primo-ltools-sdk
        ref: main
        token: ${{ secrets.PRIMO_SDK_TOKEN }}
        path: ltools-sdk

    - name: Install LTools SDK to default Primo location
      shell: pwsh
      run: |
        $dest = "C:\Program Files\Primo\Primo Studio Community x64"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        Copy-Item -Path "ltools-sdk/*.dll" -Destination $dest -Force
        $count = (Get-ChildItem $dest -Filter "LTools*.dll").Count
        Write-Host "Установлено LTools-сборок: $count"

    - name: Build Release package
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
        $msbuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild Primo.MIA.csproj /t:Restore /p:Configuration=Release /m
        if ($LASTEXITCODE -ne 0) { throw "Restore failed: $LASTEXITCODE" }
        & $msbuild Primo.MIA.csproj /t:Build /p:Configuration=Release "/p:Version=${{ steps.version.outputs.version }}" /m
        if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
        $nupkg = Get-ChildItem "bin\Release\*.nupkg"
        if (-not $nupkg) { throw "nupkg не создан" }
        Write-Host "Создан пакет: $($nupkg.Name)"

    - name: Publish to NuGet.org
      shell: bash
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if [ -z "$NUGET_API_KEY" ]; then
          echo "NUGET_API_KEY не задан — публикация в nuget.org пропущена"
          exit 0
        fi
        dotnet nuget push bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-${{ steps.version.outputs.version }}
        path: bin/Release/*.nupkg

  release-instructions:
    name: ℹ️ Release Instructions
    runs-on: ubuntu-latest
    needs: validate-release

    steps:
    - name: Release process (SemVer)
      run: |
        echo "================================================"
        echo " 📦 ПРОЦЕСС РЕЛИЗА Primo.MIA"
        echo "================================================"
        echo ""
        echo " Полная сборка и публикация выполняются в job 'publish-nuget'"
        echo " (SDK берётся из приватного репозитория chelslava/primo-ltools-sdk)."
        echo ""
        echo " ЧТОБЫ ВЫПУСТИТЬ РЕЛИЗ:"
        echo ""
        echo " 1. Обновите CHANGELOG.md (секция 'Что нового в версии X.Y.Z')"
        echo "    и <Version>X.Y.Z</Version> в Primo.MIA.csproj (все остальные"
        echo "    версии сборки наследуются от неё автоматически)."
        echo "    Без секции CHANGELOG релиз по тегу ЗАВЕРШИТСЯ ОШИБКОЙ"
        echo "    (проверка в job 'validate-release')."
        echo ""
        echo " 2. Закоммитьте и создайте тег:"
        echo "      git tag vX.Y.Z && git push origin vX.Y.Z"
        echo ""
        echo " 3. Workflow соберёт пакет с Version=X.Y.Z (тег перекрывает csproj),"
        echo "    AssemblyVersion/FileVersion унаследуют ту же версию, и опубликует"
        echo "    пакет в nuget.org (если задан секрет NUGET_API_KEY)."
        echo ""
        echo " 4. Создайте GitHub Release с тегом vX.Y.Z и заметками из CHANGELOG."
        echo ""
        echo "================================================"
        echo " 📝 ВЕРСИОНИРОВАНИЕ (SemVer: MAJOR.MINOR.PATCH)"
        echo "================================================"
        echo ""
        echo "   MAJOR - Несовместимые изменения API"
        echo "   MINOR - Новая функциональность (обратно совместимо)"
        echo "   PATCH - Исправления багов (обратно совместимо)"
        echo ""
        echo "   Примеры:"
        echo "   v1.0.1  - Исправление бага"
        echo "   v1.1.0  - Новая активность"
        echo "   v2.0.0  - Ломающие изменения API"
        echo ""
        echo "================================================"
