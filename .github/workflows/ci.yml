name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Validate Project Structure
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      name: Checkout code
      
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: '6.x'
        
    - name: Restore NuGet Packages
      run: nuget restore Primo.MIA.sln
      
    - name: Check Project Files Exist
      run: |
        if (Test-Path "Primo.MIA.csproj") { Write-Host "✅ Primo.MIA.csproj found" } else { Write-Host "❌ Primo.MIA.csproj NOT found"; exit 1 }
        if (Test-Path "Primo.MIA.Tests\Primo.MIA.Tests.csproj") { Write-Host "✅ Tests project found" } else { Write-Host "❌ Tests project NOT found"; exit 1 }
        
    - name: Validate .gitignore
      run: |
        $content = Get-Content ".gitignore" -Raw
        if ($content -match "\.vscode/") { Write-Host "✅ .vscode in .gitignore" } else { Write-Host "⚠️ .vscode NOT in .gitignore" }
        if ($content -match "\.kiro/") { Write-Host "✅ .kiro in .gitignore" } else { Write-Host "⚠️ .kiro NOT in .gitignore" }
        if ($content -match "\.dotnet/") { Write-Host "✅ .dotnet in .gitignore" } else { Write-Host "⚠️ .dotnet NOT in .gitignore" }

  code-quality:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Check file headers
      shell: bash
      run: |
        missing=0
        while IFS= read -r f; do
          if ! head -1 "$f" | grep -q "^// ==="; then
            echo "Missing header: $f"
            missing=$((missing + 1))
          fi
        done < <(find . -name "*Back.cs" -not -path "*/obj/*")
        if [ $missing -gt 0 ]; then
          echo "::warning::$missing files missing // === headers"
        fi
        echo "Header check complete"

    - name: Check csproj duplicates
      shell: pwsh
      run: |
        $content = Get-Content "Primo.MIA.csproj" -Raw
        $matches = [regex]::Matches($content, '<Compile Include="([^"]+)"')
        $includes = $matches | ForEach-Object { $_.Groups[1].Value }
        $dupes = $includes | Group-Object | Where-Object { $_.Count -gt 1 }
        if ($dupes) {
          $dupes | ForEach-Object { Write-Warning "Duplicate: $($_.Name)" }
          exit 1
        }
        Write-Host "No duplicate Compile includes found"

    - name: Check no raw ArgumentException throws
      shell: bash
      run: |
        count=$(grep -r "throw new ArgumentNullException\|throw new ArgumentException" \
          --include="*Back.cs" \
          . | grep -v "/obj/" | wc -l)
        if [ $count -gt 0 ]; then
          echo "::warning::Found $count raw ArgumentException throws (should use Guard.*)"
          grep -rn "throw new ArgumentNullException\|throw new ArgumentException" \
            --include="*Back.cs" . | grep -v "/obj/"
        fi
        echo "Exception check complete: $count raw throws"

    - name: Check version consistency (csproj ↔ CHANGELOG)
      shell: pwsh
      run: |
        $csproj = Get-Content "Primo.MIA.csproj" -Raw
        $version = [regex]::Match($csproj, '<Version>([^<]+)</Version>').Groups[1].Value
        if (-not $version) {
          Write-Host "::error::Property <Version> не найдена в Primo.MIA.csproj"
          exit 1
        }
        # Все версии сборки должны наследоваться от <Version>
        foreach ($prop in @('AssemblyVersion', 'FileVersion')) {
          $m = [regex]::Match($csproj, "<$prop>([^<]+)</$prop>")
          if ($m.Success -and $m.Groups[1].Value -notmatch '\$\(Version') {
            Write-Host "::error::$prop захардкожена ('$($m.Groups[1].Value)') — должна наследоваться от <Version>"
            exit 1
          }
        }
        $changelog = Get-Content "CHANGELOG.md" -Raw
        # ASCII-only проверка (устойчива к кодировке): номер версии должен
        # присутствовать в CHANGELOG (секция "Что нового в версии X.Y.Z")
        if ($changelog -match [regex]::Escape($version)) {
          Write-Host "OK: CHANGELOG contains version $version"
        } else {
          Write-Host "::warning::CHANGELOG.md has no entry for current version $version - add a section before release"
        }

    - name: Statistics Summary
      shell: bash
      run: |
        back_count=$(find . -name "*Back.cs" -not -path "*/obj/*" | wc -l)
        logic_count=$(find . -name "*Logic.cs" -not -path "*/obj/*" | wc -l)
        echo "## Code Statistics" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Activities (*Back.cs) | $back_count |" >> $GITHUB_STEP_SUMMARY
        echo "| Logic classes (*Logic.cs) | $logic_count |" >> $GITHUB_STEP_SUMMARY

  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    needs: [validate, code-quality]

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Checkout LTools SDK (private bundle)
      uses: actions/checkout@v4
      with:
        repository: chelslava/primo-ltools-sdk
        ref: main
        token: ${{ secrets.PRIMO_SDK_TOKEN }}
        path: ltools-sdk

    - name: Install LTools SDK to default Primo location
      shell: pwsh
      run: |
        # HintPath в csproj указывает на стандартный путь установки Primo Studio
        $dest = "C:\Program Files\Primo\Primo Studio Community x64"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        Copy-Item -Path "ltools-sdk/*.dll" -Destination $dest -Force
        $count = (Get-ChildItem $dest -Filter "LTools*.dll").Count
        Write-Host "Установлено LTools-сборок: $count"

    - name: Build and run tests
      shell: pwsh
      # issue #21: стандартный прогон исключает Category=Integration —
      # тесты с внешними системами выполняет отдельный workflow integration.yml
      run: scripts\run-tests-vs.ps1 -ResultsPath "$PWD\test-results\results.trx" -TestFilter "Category!=Integration"

    - name: Test summary
      if: always()
      shell: pwsh
      run: |
        $trxFile = "test-results\results.trx"
        if (Test-Path $trxFile) {
          $xml = [xml](Get-Content $trxFile)
          $counters = $xml.TestRun.ResultSummary.Counters
          echo "## Test Results" >> $env:GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $env:GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Passed  | $($counters.passed) |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Failed  | $($counters.failed) |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Skipped | $($counters.skipped) |" >> $env:GITHUB_STEP_SUMMARY
          echo "| **Total** | **$($counters.total)** |" >> $env:GITHUB_STEP_SUMMARY
        }

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_number }}
        path: test-results/*.trx
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-${{ github.run_number }}
        path: bin/Debug/*.nupkg
        retention-days: 30
        if-no-files-found: ignore
