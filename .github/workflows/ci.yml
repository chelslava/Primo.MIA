name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Validate Project Structure
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      name: Checkout code
      
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: '6.x'
        
    - name: Restore NuGet Packages
      run: nuget restore Primo.MIA.slnx
      
    - name: Check Project Files Exist
      run: |
        if (Test-Path "Primo.MIA.csproj") { Write-Host "✅ Primo.MIA.csproj found" } else { Write-Host "❌ Primo.MIA.csproj NOT found"; exit 1 }
        if (Test-Path "Primo.MIA.nuspec") { Write-Host "✅ Primo.MIA.nuspec found" } else { Write-Host "❌ Primo.MIA.nuspec NOT found"; exit 1 }
        if (Test-Path "Primo.MIA.Tests\Primo.MIA.Tests.csproj") { Write-Host "✅ Tests project found" } else { Write-Host "❌ Tests project NOT found"; exit 1 }
        
    - name: Validate .gitignore
      run: |
        $content = Get-Content ".gitignore" -Raw
        if ($content -match "\.vscode/") { Write-Host "✅ .vscode in .gitignore" } else { Write-Host "⚠️ .vscode NOT in .gitignore" }
        if ($content -match "\.kiro/") { Write-Host "✅ .kiro in .gitignore" } else { Write-Host "⚠️ .kiro NOT in .gitignore" }
        if ($content -match "\.dotnet/") { Write-Host "✅ .dotnet in .gitignore" } else { Write-Host "⚠️ .dotnet NOT in .gitignore" }

  code-quality:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Check file headers
      shell: bash
      run: |
        missing=0
        while IFS= read -r f; do
          if ! head -1 "$f" | grep -q "^// ==="; then
            echo "Missing header: $f"
            missing=$((missing + 1))
          fi
        done < <(find . -name "*Back.cs" -not -path "*/obj/*")
        if [ $missing -gt 0 ]; then
          echo "::warning::$missing files missing // === headers"
        fi
        echo "Header check complete"

    - name: Check csproj duplicates
      shell: pwsh
      run: |
        $content = Get-Content "Primo.MIA.csproj" -Raw
        $matches = [regex]::Matches($content, '<Compile Include="([^"]+)"')
        $includes = $matches | ForEach-Object { $_.Groups[1].Value }
        $dupes = $includes | Group-Object | Where-Object { $_.Count -gt 1 }
        if ($dupes) {
          $dupes | ForEach-Object { Write-Warning "Duplicate: $($_.Name)" }
          exit 1
        }
        Write-Host "No duplicate Compile includes found"

    - name: Check no raw ArgumentException throws
      shell: bash
      run: |
        count=$(grep -r "throw new ArgumentNullException\|throw new ArgumentException" \
          --include="*Back.cs" \
          . | grep -v "/obj/" | wc -l)
        if [ $count -gt 0 ]; then
          echo "::warning::Found $count raw ArgumentException throws (should use Guard.*)"
          grep -rn "throw new ArgumentNullException\|throw new ArgumentException" \
            --include="*Back.cs" . | grep -v "/obj/"
        fi
        echo "Exception check complete: $count raw throws"

    - name: Statistics Summary
      shell: bash
      run: |
        back_count=$(find . -name "*Back.cs" -not -path "*/obj/*" | wc -l)
        logic_count=$(find . -name "*Logic.cs" -not -path "*/obj/*" | wc -l)
        echo "## Code Statistics" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Activities (*Back.cs) | $back_count |" >> $GITHUB_STEP_SUMMARY
        echo "| Logic classes (*Logic.cs) | $logic_count |" >> $GITHUB_STEP_SUMMARY

  build-and-test:
    name: Build & Test (Self-hosted)
    runs-on: [self-hosted, primo-studio]
    needs: [validate, code-quality]
    # Запускается только если настроен self-hosted runner с меткой 'primo-studio'
    # Настройка: Settings → Actions → Runners → New self-hosted runner
    # Требования: Windows, Visual Studio 2022, Primo Studio Community x64
    if: ${{ vars.PRIMO_SELFHOSTED_RUNNER == 'true' }}

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Restore NuGet packages
      shell: cmd
      run: nuget restore Primo.MIA.slnx

    - name: Build main project (Release)
      shell: cmd
      run: msbuild Primo.MIA.csproj /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /nologo

    - name: Build test project (Debug)
      shell: cmd
      run: msbuild Primo.MIA.Tests\Primo.MIA.Tests.csproj /p:Configuration=Debug /p:Platform="Any CPU" /v:minimal /nologo

    - name: Run tests with vstest
      shell: cmd
      run: |
        vstest.console.exe "Primo.MIA.Tests\bin\Debug\Primo.MIA.Tests.dll" /Logger:trx /ResultsDirectory:TestResults /InIsolation
      continue-on-error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4.16.0
      with:
        name: test-results-${{ github.run_number }}
        path: TestResults/*.trx
        retention-days: 30
        overwrite: true

    - name: Test summary
      if: always()
      shell: pwsh
      run: |
        $trxFiles = Get-ChildItem TestResults -Filter "*.trx" -ErrorAction SilentlyContinue
        if ($trxFiles) {
          $xml = [xml](Get-Content $trxFiles[0].FullName)
          $counters = $xml.TestRun.ResultSummary.Counters
          $total   = $counters.total
          $passed  = $counters.passed
          $failed  = $counters.failed
          $skipped = $counters.skipped
          echo "## Test Results" >> $env:GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $env:GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Passed  | $passed |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Failed  | $failed |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Skipped | $skipped |" >> $env:GITHUB_STEP_SUMMARY
          echo "| **Total** | **$total** |" >> $env:GITHUB_STEP_SUMMARY
        }

  note-about-primo-sdk:
    name: Setup Self-hosted Runner
    runs-on: ubuntu-latest
    needs: [validate, code-quality]
    if: ${{ vars.PRIMO_SELFHOSTED_RUNNER != 'true' }}

    steps:
    - name: How to enable full build and tests
      run: |
        echo "================================================"
        echo " ПОЛНАЯ СБОРКА И ТЕСТЫ: нужен self-hosted runner"
        echo "================================================"
        echo ""
        echo "Для активации job 'Build & Test':"
        echo ""
        echo "1. Настройте self-hosted runner:"
        echo "   GitHub Repo → Settings → Actions → Runners"
        echo "   → New self-hosted runner → Windows x64"
        echo "   Добавьте метку: primo-studio"
        echo ""
        echo "2. На машине runner установите:"
        echo "   - Visual Studio 2022 (компонент .NET desktop)"
        echo "   - Primo Studio Community x64"
        echo "   - nuget.exe (в PATH)"
        echo ""
        echo "3. Включите job в настройках репозитория:"
        echo "   Settings → Variables → New repository variable"
        echo "   Name:  PRIMO_SELFHOSTED_RUNNER"
        echo "   Value: true"
        echo ""
        echo "4. Локальная сборка и тесты:"
        echo "   msbuild Primo.MIA.csproj /p:Configuration=Release"
        echo "   msbuild Primo.MIA.Tests\Primo.MIA.Tests.csproj /p:Configuration=Debug"
        echo "   vstest.console.exe Primo.MIA.Tests\bin\Debug\Primo.MIA.Tests.dll"
        echo "================================================"
